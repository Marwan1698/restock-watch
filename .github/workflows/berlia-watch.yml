name: Berlia S25 Ultra Transparent restock watch

# GitHub's cron timer is best-effort (it skipped runs for ~10 hours), so each run
# checks once an hour for ~5h50m and then starts the next run itself.
# The cron below is only a backup to restart the chain if it ever breaks.
on:
  schedule:
    - cron: "41 */3 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test push with the current status"
        type: boolean
        default: true
      fails:
        description: "Internal: failed checks carried over from the previous run"
        default: "0"

# Only one watcher at a time; a new run waits until the current one ends.
concurrency:
  group: berlia-watch
  cancel-in-progress: false

permissions:
  actions: write   # to start the next run and to disable itself when back in stock
  contents: read

env:
  PRODUCT_JSON: https://mrcaseseg.com/products/berlia-case.js
  PRODUCT_URL: https://mrcaseseg.com/products/berlia-case?variant=68098344911100
  VARIANT_ID: "68098344911100"   # S25ultra / Transparent (not MagSafe)
  CHECK_EVERY: 3600              # seconds between checks (1 hour)
  RUN_FOR: 21000                 # seconds per run (~5h50m) before handing over
  UA: "Mozilla/5.0 (Linux; Android 14; SM-S938B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0.0.0 Mobile Safari/537.36"

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: Watch stock
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          IS_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
          CARRIED_FAILS: ${{ inputs.fails || '0' }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          if [ -z "$NTFY_TOPIC" ]; then
            echo "::error::Repo secret NTFY_TOPIC is missing"; exit 1
          fi

          notify() {  # $1 title, $2 message, $3 priority, $4 tags
            curl -sS -o /dev/null -w "ntfy HTTP %{http_code}\n" \
                 -H "Title: $1" -H "Priority: $3" -H "Tags: $4" \
                 -H "Click: $PRODUCT_URL" -d "$2" "https://ntfy.sh/$NTFY_TOPIC"
          }

          handover() {  # start the next run (on a fresh GitHub server) and stop this one
            echo "Handing over to the next run (fails=$1)"
            gh api -X POST "repos/$REPO/actions/workflows/berlia-watch.yml/dispatches" \
              -f ref=main -f 'inputs[test]=false' -f "inputs[fails]=$1"
            exit 0
          }

          # Prints "<available> <price>", or fails. Retries 3x (also on 403).
          check() {
            json=$(curl -sS --fail --retry 3 --retry-all-errors --retry-delay 30 \
                   -A "$UA" -H "Accept: application/json,*/*;q=0.8" -H "Accept-Language: en-US,en;q=0.9" \
                   "$PRODUCT_JSON?t=$(date +%s)") || return 1
            out=$(echo "$json" | jq -r --argjson id "$VARIANT_ID" \
              '.variants[] | select(.id == $id) | "\(.available) \(.price / 100)"')
            [ -n "$out" ] && echo "$out"
          }

          fails=$CARRIED_FAILS
          first=1
          while :; do
            r=$(check) || r=""
            if [ -z "$r" ]; then
              fails=$((fails+1)); echo "$(date -u +%FT%TZ) check failed ($fails in a row)"
              [ "$fails" -eq 3 ] && notify "Berlia watch: checks failing" \
                "The store blocked 3 checks in a row. Still trying every hour." high warning
              if [ "$first" = 1 ] && [ "$IS_TEST" = "true" ]; then
                notify "Berlia watch TEST: blocked, retrying" \
                  "This GitHub server was blocked by the store; retrying on a new one." default hourglass
              fi
              # Blocks are per GitHub server, so retry soon on a new one (up to 5 times),
              # then fall back to the normal hourly rhythm.
              [ "$fails" -le 5 ] && { sleep 60; handover "$fails"; }
            else
              set -- $r
              echo "$(date -u +%FT%TZ) S25 Ultra Transparent available=$1 price=LE $2"
              if [ "$1" = "true" ]; then
                notify "Berlia case is BACK IN STOCK" "S25 Ultra Transparent - LE $2. Tap to open." urgent tada
                gh workflow disable berlia-watch.yml -R "$REPO" || true
                exit 0
              fi
              if [ "$fails" -gt 0 ] || { [ "$first" = 1 ] && [ "$IS_TEST" = "true" ]; }; then
                notify "Berlia watch: working" \
                  "Still sold out (S25 Ultra Transparent, LE $2). Checking every hour; you'll get a push when it's back." default white_check_mark
              fi
              fails=0
            fi
            first=0
            [ $((SECONDS + CHECK_EVERY)) -ge "$RUN_FOR" ] && handover "$fails"
            sleep "$CHECK_EVERY"
          done
